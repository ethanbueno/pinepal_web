# Render Blueprint for the PinePal API (the Flask backend in backend/).
# The database stays on Aiven MySQL; this only runs Flask.
# Steps and the values to fill in: backend/DEPLOY_RENDER.md
services:
  - type: web
    name: pinepal-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # 1 worker so the model is loaded once (the free plan has 512 MB);
    # threads handle requests at the same time. Render sets $PORT.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Aiven MySQL: the same values as backend/.env on your laptop
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: pinepal_db
      # ca.pem is added as a Secret File, which Render puts in /etc/secrets
      - key: DB_SSL_CA
        value: /etc/secrets/ca.pem
      # Copy the one from backend/.env so existing logins keep working
      - key: JWT_SECRET_KEY
        sync: false
      # Copy the one from backend/.env: it encrypts and decrypts the stored IP addresses
      - key: DATA_ENCRYPTION_KEY
        sync: false

  # The web dashboard (the React app in src/). A static site: Render builds it with Vite on
  # every push to main and serves the files. It talks to the API above.
  - type: web
    name: pinepal-web
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # read at build time by src/api/axios.js
      - key: VITE_API_URL
        value: https://pinepal-api-rebe.onrender.com
    # every page (/login, /scans/123 ...) is the same index.html; React Router picks the page
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # the built JS and CSS have the content hash in their names, so they can be cached for good
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html must never be cached, or people keep seeing an old version after a deploy
      - path: /index.html
        name: Cache-Control
        value: no-cache
